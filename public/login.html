<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | ZM Generator စီမံခန့်ခွဲသူ လော့ဂ်အင်</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="relative w-full max-w-md">
    <!-- Glow behind card -->
    <div class="absolute -top-10 -left-10 w-48 h-48 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="glass rounded-3xl p-8 border border-slate-800 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <div class="w-14 h-14 rounded-2xl bg-amber-500 text-slate-950 flex items-center justify-center mx-auto shadow-lg shadow-amber-500/30">
          <i data-lucide="lock" class="w-7 h-7 stroke-[2.5]"></i>
        </div>
        <h2 class="text-2xl font-black text-white">ZM ADMIN PORTAL</h2>
        <p class="text-xs text-slate-400">မီးစက်စနစ် စီမံခန့်ခွဲသူများသာ ဝင်ရောက်နိုင်ပါသည်</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">အကောင့်အမည် (Username)</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="username" required value="admin" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-3 py-3 text-xs text-white focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">လျှို့ဝှက်နံပါတ် (Password)</label>
          <div class="relative">
            <i data-lucide="key" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="password" id="password" required value="admin123" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-3 py-3 text-xs text-white focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <!-- Default Credentials Hint -->
        <div class="p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 text-[11px] text-amber-300/90 leading-relaxed flex items-center gap-2">
          <i data-lucide="info" class="w-4 h-4 text-amber-400 shrink-0"></i>
          <div>စမ်းသပ်အကောင့်: <strong>admin</strong> / <strong>admin123</strong></div>
        </div>

        <button type="submit" id="btn-login" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 text-slate-950 font-extrabold text-sm shadow-xl shadow-amber-500/20 transition flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>လော့ဂ်အင် ဝင်မည် (Sign In)</span>
        </button>
      </form>

      <div class="text-center pt-2">
        <a href="/" class="text-xs text-slate-400 hover:text-white flex items-center justify-center gap-1">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> ဝက်ဘ်ဆိုက် ပင်မစာမျက်နှာသို့ ပြန်သွားရန်
        </a>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.innerHTML = 'ဝင်ရောက်နေပါသည်...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const json = await res.json();
        if (json.success) {
          showToast('လော့ဂ်အင် အောင်မြင်ပါသည်! Admin Panel သို့ ကူးပြောင်းနေသည်...');
          setTimeout(() => {
            window.location.href = '/admin.html';
          }, 800);
        } else {
          showToast(json.error || 'လော့ဂ်အင် မအောင်မြင်ပါ', 'error');
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i><span>လော့ဂ်အင် ဝင်မည်</span>`;
          lucide.createIcons();
        }
      } catch (err) {
        showToast('ဆာဗာသို့ ချိတ်ဆက်မရပါ', 'error');
        btn.disabled = false;
        btn.innerHTML = 'လော့ဂ်အင် ဝင်မည်';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
